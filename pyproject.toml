[project]
name = "lab-pytorch-v1"
version = "0.1.0"
description = "Activité pratique N°1 — Bases de PyTorch (EMSI, Data & IA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.1",
    "torcheval>=0.0.7",
    "torchmetrics>=1.3",
    "torchvision>=0.16",
    "torchviz>=0.0.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_pytorch_v1"]
